name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  flatpak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Ensure metainfo has a release entry for this version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          DATE=$(date +%Y-%m-%d)
          METAINFO="flatpak/io.github.subsite.TunnelMan.metainfo.xml"
          if ! grep -q "version=\"$VERSION\"" "$METAINFO"; then
            sed -i "s|<releases>|<releases>\n    <release version=\"$VERSION\" date=\"$DATE\"/>|" "$METAINFO"
          fi

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tunnelman.flatpak
          manifest-path: flatpak/io.github.subsite.TunnelMan.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: TunnelMan ${{ github.ref_name }}
          files: tunnelman.flatpak
          generate_release_notes: true
